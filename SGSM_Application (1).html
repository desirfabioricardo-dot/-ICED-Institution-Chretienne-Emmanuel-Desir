<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGSM — Gestion scolaire</title>
<style>
:root{--navy:#14243b;--blue:#2563eb;--bg:#f3f6fb;--line:#e5eaf2;--muted:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172338;font:14px/1.5 Arial,sans-serif}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:22px 14px}.brand{font-size:21px;font-weight:bold;padding:8px 12px 25px}.brand small{display:block;font-size:11px;color:#aab8cc;font-weight:normal}.nav{display:grid;gap:5px}.nav button{background:none;color:#c7d2e2;text-align:left;padding:12px;border:0;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#263b59;color:white}.main{min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:19px 28px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:19px;margin:0}.top small{color:var(--muted)}.content{padding:26px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.head h2{margin:0;font-size:23px}.head p{margin:4px 0;color:var(--muted)}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;font-weight:600}.primary{background:var(--blue);color:white}.secondary{background:#edf2f8;color:#334155}.danger{background:#fee2e2;color:#b91c1c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}.panel{margin-bottom:17px}.panel h3{margin:0 0 15px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{text-align:left;background:#f3f6fb;color:#30445f;padding:15px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.search{padding:10px;border:1px solid var(--line);border-radius:8px;min-width:220px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);text-transform:uppercase;background:#f8fafc}.tablewrap{overflow:auto}.empty{text-align:center;color:var(--muted);padding:30px}.pill{border-radius:20px;padding:4px 8px;background:#eaf1ff;color:#2455a5;font-size:11px}.modalbg{display:none;position:fixed;inset:0;background:#0f172a99;align-items:center;justify-content:center;padding:15px}.modalbg.show{display:flex}.modal{background:white;border-radius:14px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.field{display:grid;gap:5px}.field label{font-weight:bold;font-size:12px}.field input,.field select{padding:10px;border:1px solid #dbe2ec;border-radius:8px;width:100%}.actions{display:flex;gap:6px}.actions button{padding:6px 8px;font-size:11px}.foot{margin-top:18px;padding:12px;background:#eff6ff;color:#1e40af;border-radius:8px;font-size:12px}.toast{display:none;position:fixed;bottom:20px;right:20px;background:#14243b;color:white;padding:12px 17px;border-radius:9px}.toast.show{display:block}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{padding:10px}.brand{padding:5px 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.top{padding:14px}.content{padding:15px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:480px){.fields{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.search{min-width:100%}}
</style></head><body>
<div class="layout"><aside class="side"><div class="brand">SGSM<small>Institution Chrétienne Emmanuel</small></div><div class="nav" id="nav">
<button class="active" data-page="dashboard">▦ Tableau de bord</button><button data-page="eleves">♙ Élèves</button><button data-page="classes">▤ Classes</button><button data-page="enseignants">♧ Enseignants</button><button data-page="paiements">＄ Paiements</button><button data-page="notes">✎ Notes</button><button data-page="presences">✓ Présences</button><button data-page="rapports">▥ Rapports & données</button>
</div></aside><main class="main"><header class="top"><div><h1 id="title">Tableau de bord</h1><small>Application de gestion scolaire</small></div><b>Administrateur</b></header><div class="content" id="view"></div></main></div>
<div class="modalbg" id="modalbg"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Ajouter</h3><button class="secondary" onclick="closeForm()">Fermer ✕</button></div><form id="form"><div class="fields" id="fields"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="secondary" onclick="closeForm()">Annuler</button><button class="primary">Enregistrer</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const initial={eleves:[],classes:[],enseignants:[],paiements:[],notes:[],presences:[]},KEY='sgsm_emmanuel_data';
let db;try{db={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){db={...initial}}
let page='dashboard',kind='',editId=null;
const cfg={
eleves:{label:'Élèves',fields:[['nom','Nom','text',1],['prenom','Prénom','text',1],['sexe','Sexe','select',1,['Masculin','Féminin']],['dateNaissance','Date de naissance','date'],['classe','Classe','select',0,'classes'],['annee','Année académique','text',1],['parent','Parent / tuteur','text'],['telephone','Téléphone','tel'],['adresse','Adresse','text'],['statut','Statut','select',1,['Actif','Inactif','Transféré','Archivé']]]},
classes:{label:'Classes',fields:[['nom','Nom de la classe','text',1],['niveau','Niveau','text',1],['annee','Année académique','text',1],['titulaire','Enseignant titulaire','text'],['capacite','Capacité','number']]},
enseignants:{label:'Enseignants',fields:[['nom','Nom','text',1],['prenom','Prénom','text',1],['matiere','Matière','text',1],['telephone','Téléphone','tel'],['email','E-mail','email'],['statut','Statut','select',1,['Actif','Inactif']]},
paiements:{label:'Paiements',fields:[['matricule','Matricule élève','select',1,'eleves'],['date','Date','date',1],['motif','Motif','text',1],['montant','Montant','number',1],['devise','Devise','select',1,['HTG','USD']],['reference','Référence reçu','text']]},
notes:{label:'Notes',fields:[['matricule','Matricule élève','select',1,'eleves'],['matiere','Matière','text',1],['evaluation','Évaluation / période','text',1],['note','Note','number',1],['bareme','Barème','number',1],['date','Date','date']]},
presences:{label:'Présences',fields:[['matricule','Matricule élève','select',1,'eleves'],['date','Date','date',1],['statut','Statut','select',1,['Présent','Absent','Retard']],['motif','Remarque','text']]}
};
const titles={dashboard:'Tableau de bord',eleves:'Gestion des élèves',classes:'Gestion des classes',enseignants:'Gestion des enseignants',paiements:'Gestion des paiements',notes:'Gestion des notes',presences:'Gestion des présences',rapports:'Rapports & données'};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)};
function matricule(){let y=new Date().getFullYear(),n=db.eleves.filter(x=>(x.matricule||'').startsWith('SGSM-'+y)).length+1;return 'SGSM-'+y+'-'+String(n).padStart(4,'0')}
function dashboard(){let total=db.eleves.length,active=db.eleves.filter(x=>x.statut==='Actif').length,sum=db.paiements.reduce((a,x)=>a+Number(x.montant||0),0),abs=db.presences.filter(x=>x.statut==='Absent').length;
return `<div class="head"><div><h2>Bienvenue dans votre espace</h2><p>Vue générale de votre établissement scolaire.</p></div><button class="primary" onclick="openForm('eleves')">＋ Nouvelle inscription</button></div><div class="stats"><div class="stat"><small>Total élèves</small><strong>${total}</strong></div><div class="stat"><small>Élèves actifs</small><strong>${active}</strong></div><div class="stat"><small>Paiements enregistrés</small><strong>${sum.toLocaleString('fr-FR')}</strong></div><div class="stat"><small>Absences saisies</small><strong>${abs}</strong></div></div><div class="grid"><section class="panel"><h3>Dernières inscriptions</h3>${table('eleves',db.eleves.slice(-5).reverse())}</section><section class="panel"><h3>Accès rapide</h3><div class="quick"><button onclick="openForm('eleves')">♙ Inscrire un élève</button><button onclick="openForm('paiements')">＄ Paiement</button><button onclick="openForm('notes')">✎ Saisir une note</button><button onclick="openForm('presences')">✓ Présence</button></div><div class="foot">Les informations sont sauvegardées dans le navigateur de cet appareil. Faites des sauvegardes régulières.</div></section></div>`}
function table(type,rows){if(!rows.length)return '<div class="empty">Aucune donnée enregistrée.</div>';let cols={eleves:['matricule','nom','prenom','classe','annee','statut'],classes:['nom','niveau','annee','titulaire','capacite'],enseignants:['nom','prenom','matiere','telephone','statut'],paiements:['reference','matricule','date','motif','montant','devise'],notes:['matricule','matiere','evaluation','note','bareme'],presences:['matricule','date','statut','motif']}[type];let labels={matricule:'Matricule',nom:'Nom',prenom:'Prénom',classe:'Classe',annee:'Année',statut:'Statut',niveau:'Niveau',titulaire:'Titulaire',capacite:'Capacité',matiere:'Matière',telephone:'Téléphone',reference:'Référence',date:'Date',motif:'Motif',montant:'Montant',devise:'Devise',evaluation:'Évaluation',note:'Note',bareme:'Barème'};
return `<div class="tablewrap"><table><thead><tr>${cols.map(k=>'<th>'+labels[k]+'</th>').join('')}<th>Actions</th></tr></thead><tbody>${rows.map(r=>'<tr>'+cols.map(k=>'<td>'+safe(r[k])+'</td>').join('')+`<td><div class="actions"><button class="secondary" onclick="editItem('${type}','${r.id}')">Modifier</button><button class="danger" onclick="removeItem('${type}','${r.id}')">Supprimer</button></div></td></tr>`).join('')}</tbody></table></div>`}
function listPage(p){let rows=db[p],label=cfg[p].label;return `<div class="head"><div><h2>${label}</h2><p>Créer, consulter et modifier les informations.</p></div><button class="primary" onclick="openForm('${p}')">＋ Ajouter</button></div><section class="panel"><div class="toolbar" style="justify-content:space-between;margin-bottom:15px"><b>Liste (${rows.length})</b><input class="search" id="search" placeholder="Rechercher..."></div><div id="tableArea">${table(p,rows)}</div></section>`}
function reports(){return `<div class="head"><div><h2>Rapports & données</h2><p>Exporter ou sauvegarder les données de votre école.</p></div></div><section class="panel"><h3>Exporter les listes en CSV</h3>${Object.keys(cfg).map(k=>`<p><button class="secondary" onclick="csv('${k}')">Télécharger ${cfg[k].label} (CSV)</button></p>`).join('')}</section><section class="panel"><h3>Sauvegarde complète</h3><p>Conservez une copie de toutes les données de l'application.</p><button class="primary" onclick="backup()">Télécharger sauvegarde JSON</button><hr><h3>Restaurer une sauvegarde</h3><input type="file" id="restoreFile" accept=".json"><button class="secondary" onclick="restore()" style="margin-left:8px">Restaurer</button><div class="foot">Attention : cette version fonctionne localement sur un seul navigateur/appareil. Elle n'est pas encore synchronisée entre plusieurs ordinateurs ou téléphones. Les données scolaires sensibles doivent être protégées par un serveur sécurisé avant un déploiement multi-utilisateur.</div></section>`}
function render(){document.getElementById('title').textContent=titles[page];document.getElementById('view').innerHTML=page==='dashboard'?dashboard():page==='rapports'?reports():listPage(page);let s=document.getElementById('search');if(s)s.oninput=()=>{let q=s.value.toLowerCase();document.getElementById('tableArea').innerHTML=table(page,db[page].filter(r=>Object.values(r).join(' ').toLowerCase().includes(q))) }}
function openForm(type,obj=null){kind=type;editId=obj?.id||null;document.getElementById('modalTitle').textContent=(obj?'Modifier ':'Ajouter ')+cfg[type].label;document.getElementById('fields').innerHTML=cfg[type].fields.map(f=>{let [key,label,t,req,opts]=f,val=obj?.[key]??'';let control;if(t==='select'){let choices=opts==='classes'?db.classes.map(x=>x.nom):opts==='eleves'?db.eleves.map(x=>x.matricule):opts;control=`<select name="${key}" ${req?'required':''}><option value="">Choisir...</option>${choices.map(x=>`<option ${x===val?'selected':''} value="${safe(x)}">${safe(x)}</option>`).join('')}</select>`}else control=`<input name="${key}" type="${t}" value="${safe(val)}" ${req?'required':''} ${t==='number'?'min="0" step="0.01"':''}>`;return `<div class="field"><label>${label}${req?' *':''}</label>${control}</div>`}).join('');document.getElementById('modalbg').classList.add('show')}
function closeForm(){document.getElementById('modalbg').classList.remove('show')}
function editItem(type,id){let x=db[type].find(r=>r.id===id);if(x)openForm(type,x)}
function removeItem(type,id){if(!confirm('Confirmer la suppression ?'))return;db[type]=db[type].filter(r=>r.id!==id);save();render();notify('Élément supprimé.')}
document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(kind==='eleves'&&!editId)d.matricule=matricule();if(kind==='paiements'){d.montant=Number(d.montant);if(!d.reference)d.reference='REC-'+Date.now()}if(kind==='notes'){d.note=Number(d.note);d.bareme=Number(d.bareme);if(d.note>d.bareme)return alert('La note ne peut pas dépasser le barème.')}if(editId){let i=db[kind].findIndex(r=>r.id===editId);db[kind][i]={...db[kind][i],...d}}else db[kind].push({id:Date.now().toString()+Math.random().toString(16).slice(2),...d});save();closeForm();render();notify('Enregistrement réussi.')};
function dl(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function csv(k){if(!db[k].length)return notify('Aucune donnée à exporter.');let keys=Object.keys(db[k][0]),s=[keys.join(';'),...db[k].map(r=>keys.map(x=>'"'+String(r[x]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');dl(k+'_sgsm.csv','\ufeff'+s,'text/csv;charset=utf-8')}
function backup(){dl('sauvegarde_sgsm.json',JSON.stringify(db,null,2),'application/json')}
function restore(){let f=document.getElementById('restoreFile').files[0];if(!f)return notify('Choisissez un fichier JSON.');let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);Object.keys(initial).forEach(k=>{if(!Array.isArray(x[k]))throw 0});if(!confirm('Remplacer les données actuelles ?'))return;db={...initial,...x};save();render();notify('Sauvegarde restaurée.')}catch(e){alert('Fichier de sauvegarde invalide.')}};rd.readAsText(f)}
render();
</script></body></html>
